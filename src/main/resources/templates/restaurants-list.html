<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h1>Restaurants</h1>
    <a th:href="@{/restaurants/create}" class="btn btn-primary mb-3">Create New Restaurant</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${restaurants}">
                <td th:text="${r.name}"></td>
                <td th:text="${r.phone}"></td>
                <td th:text="${r.email}"></td>
                <td th:text="${r.active ? 'Yes' : 'No'}"></td>
                <td>
                    <a th:href="@{/restaurants/{id}/edit(id=${r.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
