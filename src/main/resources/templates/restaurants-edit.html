<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h1>Edit Restaurant</h1>
    <form th:action="@{/restaurants}" th:object="${restaurant}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" th:field="*{phone}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control">
        </div>

        <div class="mb-3">
            <label>User</label>
            <select th:field="*{user.id}" class="form-select" required>
                <option th:each="u : ${users}" th:value="${u.id}" 
                        th:text="${u.firstName + ' ' + u.lastName}" 
                        th:selected="${u.id == restaurant.user.id}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Address</label>
            <select th:field="*{address.id}" class="form-select" required>
                <option th:each="a : ${addresses}" th:value="${a.id}" 
                        th:text="${a.streetAddress + ', ' + a.city}" 
                        th:selected="${a.id == restaurant.address.id}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a th:href="@{/restaurants}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
