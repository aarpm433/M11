<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Restaurants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">

  <h1 class="mb-3">Restaurants</h1>

  <!-- Search -->
  <form th:action="@{/restaurants}" method="get" class="mb-3">
    <input type="text" name="q" class="form-control" placeholder="Search restaurants..." />
  </form>

  <!-- Restaurants Table -->
  <div class="card mb-4">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Price Range</th>
          <th>Active</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${restaurants}">
          <td th:text="${r.name}"></td>
          <td th:text="${r.phone}"></td>
          <td th:text="${r.email}"></td>
          <td th:text="${r.priceRange}"></td>
          <td>
            <span th:if="${r.active}" class="text-success">Yes</span>
            <span th:unless="${r.active}" class="text-muted">No</span>
          </td>
          <td>
            <div th:if="${r.address != null}">
              <div th:text="${r.address.streetAddress}"></div>
              <div>
                <span th:text="${r.address.city}"></span>
                <span th:text="${r.address.postalCode}"></span>
              </div>
            </div>
            <div th:unless="${r.address != null}" class="text-muted">n/a</div>
          </td>
          <td>
            <a th:href="@{/restaurants/{id}/edit(id=${r.id})}" class="btn btn-sm btn-outline-primary">Edit</a>

            <form th:action="@{/restaurants/{id}(id=${r.id})}" method="post" style="display:inline">
              <!-- Guard CSRF evaluation so template doesn't fail when _csrf is not present -->
              <div th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              </div>
              <!-- Use hidden _method to allow DELETE via HiddenHttpMethodFilter -->
              <input type="hidden" name="_method" value="delete" />
              <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this restaurant?')">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(restaurants)}">
          <td colspan="7" class="text-center text-muted">No restaurants found.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create / Edit Form -->
  <div class="card">
    <div class="card-header">
      <h5 th:text="${restaurant.id} != null ? 'Edit Restaurant' : 'Create Restaurant'"></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/restaurants}" th:object="${restaurant}" method="post">
        <!-- Guard CSRF evaluation -->
        <div th:if="${_csrf != null}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{name}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Phone</label>
            <input class="form-control" type="text" th:field="*{phone}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Price Range</label>
            <input class="form-control" type="text" th:field="*{priceRange}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Active</label>
            <select class="form-select" th:field="*{active}">
              <option th:value="true">Yes</option>
              <option th:value="false">No</option>
            </select>
          </div>

          <div class="col-12"><h6 class="mt-2">Address</h6></div>
          <div class="col-12">
            <select class="form-select" th:field="*{address.id}" required>
              <option th:if="${#lists.isEmpty(addresses)}" value="">No addresses available</option>
              <option th:each="a : ${addresses}" th:value="${a.id}"
                      th:text="${a.streetAddress + ', ' + a.city + ', ' + a.postalCode}"></option>
            </select>
          </div>

          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/restaurants}" class="btn btn-secondary">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
